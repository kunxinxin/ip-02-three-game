<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>低模星露农场｜Three.js 交互作业</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #111; font-family: "Microsoft YaHei", sans-serif; }

    #uiTopLeft {
      position: absolute; top: 12px; left: 12px;
      background: rgba(0,0,0,.65); color: #fff;
      padding: 10px 14px; border-radius: 8px;
      font-size: 14px; z-index: 20; min-width: 240px;
    }

    #uiTopRight {
      position: absolute; top: 12px; right: 12px;
      background: rgba(0,0,0,.65); color: #fff;
      padding: 10px 14px; border-radius: 8px;
      font-size: 14px; z-index: 20; text-align: right;
    }

    #shopPanel {
      display: none;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #fff; color: #222;
      padding: 24px; border-radius: 12px;
      z-index: 30; min-width: 340px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    #shopPanel h3 { margin-bottom: 14px; }
    #shopPanel p { margin: 8px 0; }
    #shopPanel button {
      margin-left:10px; padding: 6px 10px;
      cursor: pointer; border: none;
      background: #4caf50; color: #fff;
      border-radius: 6px;
    }
    #closeShopBtn{
      margin-top:12px;
      background:#888;
    }

    #tip {
      position: absolute; bottom: 16px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.65); color: #fff;
      padding: 8px 16px; border-radius: 6px;
      font-size: 13px; z-index: 20;
    }

    #damageOverlay {
      position: absolute; inset: 0;
      background: rgba(255,0,0,0);
      pointer-events: none;
      z-index: 15;
      transition: background .18s;
    }
  </style>
</head>
<body>

<div id="uiTopLeft">
  <div>💰金币：<span id="money">100</span></div>
  <div>❤️生命：<span id="hp">100</span> / <span id="maxHp">100</span></div>
  <div>🔧当前工具：<span id="currentTool">锄头</span></div>
  <div>🌾背包：<span id="bag"></span></div>
</div>

<div id="uiTopRight">
  <div>⏰时间：<span id="dayText">第 1 天 白天</span></div>
  <div>🗡️攻击力：<span id="atkStat">10</span></div>
  <div>👾史莱姆数量：<span id="slimeCount">0</span></div>
</div>

<div id="shopPanel">
  <h3>🏪 农场商店</h3>
  <p>小麦种子 5金币 <button onclick="buyItem('wheatSeed')">购买</button></p >
  <p>番茄种子 8金币 <button onclick="buyItem('tomatoSeed')">购买</button></p >
  <p>玉米种子 12金币 <button onclick="buyItem('cornSeed')">购买</button></p >
  <p>草莓种子 15金币 <button onclick="buyItem('strawberrySeed')">购买</button></p >
  <p>回血药水 20金币 <button onclick="buyItem('potion')">购买</button></p >
  <p>升级长剑 60金币 <button onclick="buyItem('swordUp')">购买</button></p >
  <button id="closeShopBtn" onclick="closeShop()">关闭商店</button>
</div>

<div id="tip">
  WASD移动｜1锄头 2水壶 3长剑｜空格播种/收割｜E浇水｜J攻击｜B商店｜H喝药水
</div>

<div id="damageOverlay"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="./main.js"></script>
</body>
</html>
